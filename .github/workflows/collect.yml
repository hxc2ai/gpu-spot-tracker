name: collect
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}
concurrency: { group: collect, cancel-in-progress: false }   # DB lives in B2; never run two at once
permissions: { contents: read }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      ALLOW_VAST_STORE: "1"   # owner's decision; Vast ToS needs written permission. Set "0" to disable.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen || uv sync
      - run: uv run python -m tracker.run --db data/tracker.db --b2
      - id: t
        run: echo "hourly=$([ $(date +%-M) -lt 15 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Build and deploy site (hourly)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.t.outputs.hourly == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_COMPUTE_TRACKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uv run python -m tracker.build_site --db data/tracker.db --out dist
          npx --yes wrangler@3 pages project create gpu-spot-tracker --production-branch main || true
          npx --yes wrangler@3 pages deploy dist --project-name gpu-spot-tracker --branch main
